creation_rules:
  - path_regex: secrets/common/.*
    key_groups:
      - age:
          - *reaper_host
          - *hoard_host
          - *harbor_host
          - *eve_host
          - *buoy_host
          - *glib_op
        pgp:
          - *yubikey_alpha
          - *yubikey_nano
  - path_regex: secrets/reaper/.*
    key_groups:
      - age:
          - *reaper_host
          - *glib_op
  - path_regex: secrets/hoard/.*
