[lint]
select = [
  "E4",  # pycodestyle: import placement
  "E7",  # pycodestyle: statement-level lints
  "E9",  # pycodestyle: syntax errors
  "F",   # pyflakes
  "I",   # isort: import ordering
  "UP",  # pyupgrade: modern syntax
  "B",   # flake8-bugbear: likely bugs
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]

[lint.per-file-ignores]
# spliced into PlexKodiConnect's track loop, where stream and track are locals
"scripts/kodi/customize/snippets/pkc-hdr.py" = ["F821"]
# spliced into Bingie's widget code before set_stream_details, where stream_details is a local
"scripts/kodi/customize/snippets/bingie-widgets-streams.py" = ["F821"]
