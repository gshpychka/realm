name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@main
      # Fleet-wide eval: all systems, no machine builds.
      - run: nix flake check --all-systems --no-build
      # --no-build skips the check derivations, so run the source checks explicitly.
      - name: Check source
        run: >-
          nix build --no-link -L
          .#checks.x86_64-linux.statix
          .#checks.x86_64-linux.deadnix
          .#checks.x86_64-linux.treefmt
          .#checks.x86_64-linux.biome
          .#checks.x86_64-linux.ruff
          .#checks.x86_64-linux.pi-extensions
          .#checks.x86_64-linux.link-sanitizer
          .#checks.x86_64-linux.voice-pe
      - name: Build packages and module checks
        run: >-
          nix build --no-link -L
          .#pituitary .#bay .#flare
          .#checks.x86_64-linux.pituitary-home-manager
          .#checks.x86_64-linux.bay-shellcheck
      - name: Validate Home Assistant configuration and migration
        run: nix build --no-link -L .#checks.x86_64-linux.home-assistant-config

  pituitary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check Pituitary
        run: >-
          nix develop .#pituitary --command bash -c
          'cd packages/pituitary && bun install --frozen-lockfile && just typecheck lint unit e2e'
