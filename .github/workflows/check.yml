name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-eval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@main
      # Workaround: Hermes's package reads its filtered Python source during
      # evaluation, which the read-only `flake check --no-build` cannot add
      # to the store; a writable evaluation of the package adds it first.
      - run: nix eval --raw .#nixosConfigurations.hoard.config.services.hermes-agent.package.drvPath
      # Evaluate flake outputs on every supported system without building checks.
      - run: nix flake check --all-systems --no-build

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check lint and formatting
        run: >-
          nix build --no-link -L
          .#checks.x86_64-linux.statix
          .#checks.x86_64-linux.deadnix
          .#checks.x86_64-linux.treefmt
          .#checks.x86_64-linux.biome
          .#checks.x86_64-linux.ruff
          .#checks.x86_64-linux.bay-shellcheck

  bay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@main
      # Building Bay runs every Go package's tests, including Flare's.
      - name: Check Bay
        run: >-
          nix build --no-link -L
          .#bay .#flare

  pituitary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build Pituitary and check its Home Manager module
        run: >-
          nix build --no-link -L
          .#pituitary
          .#checks.x86_64-linux.pituitary-home-manager
      - name: Check Pituitary
        run: >-
          nix develop .#pituitary --command bash -c
          'bun install --frozen-lockfile && cd packages/pituitary && just typecheck unit e2e'

  dura:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build Dura and check its agent declarations
        run: >-
          nix build --no-link -L
          .#dura
          .#checks.x86_64-linux.dura-agents
          .#checks.x86_64-linux.dura-catalog
      - name: Check Dura
        run: >-
          nix develop .#dura --command bash -c
          'bun install --frozen-lockfile && tsc -p packages/dura && bun test packages/dura'

  pi-extensions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build --no-link -L .#checks.x86_64-linux.pi-extensions

  link-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build --no-link -L .#checks.x86_64-linux.link-sanitizer

  probabench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build --no-link -L .#checks.x86_64-linux.probabench

  voice-pe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build --no-link -L .#checks.x86_64-linux.voice-pe

  voice-broker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build --no-link -L .#checks.x86_64-linux.voice-broker

  arr-sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build --no-link -L .#checks.x86_64-linux.arr-sync

  tautulli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build --no-link -L .#checks.x86_64-linux.tautulli

  kodi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build --no-link -L .#checks.x86_64-linux.kodi
