# bun2nix generates bun.nix from bun.lock
excludes = ["**/bun.nix"]

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

[formatter.stylua]
command = "stylua"
includes = ["*.lua"]

[formatter.shfmt]
command = "shfmt"
options = ["-i", "2", "-w"]
includes = ["*.sh", "*.bash"]

[formatter.taplo]
command = "taplo"
options = ["format"]
includes = ["*.toml"]

[formatter.ruff-format]
command = "ruff"
options = ["format"]
includes = ["*.py"]

[formatter.biome]
command = "biome"
options = ["format", "--write", "--no-errors-on-unmatched"]
includes = ["*.ts", "*.js"]
