[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rolesanywhere"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cryptography"]

[project.scripts]
rolesanywhere = "rolesanywhere.cli:main"
rolesanywhere-credentials = "rolesanywhere.client:main"

[tool.setuptools.packages.find]
where = ["src"]
